name: Apply warehouse shared-box enhancement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/warehouse-shared-box-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch warehouse mobile only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/warehouse-pilot/index.html')
          text = path.read_text(encoding='utf-8')

          old1 = "let initial=null,db=null,cryptoKey=null,securePayload=null,scanTarget='global',stream=null,scanTimer=null,syncTimer=null,syncBusy=false,statusBusy=false,smartInRows=[],splitRows=[],splitSource=null;"
          new1 = "let initial=null,db=null,cryptoKey=null,securePayload=null,scanTarget='global',stream=null,scanTimer=null,syncTimer=null,syncBusy=false,statusBusy=false,smartInRows=[],splitRows=[],splitSource=null,sharedOutSource=null;"

          old2 = '''document.querySelector('#showBoxBtn').onclick=()=>{const l=norm(document.querySelector('#findLocation').value);const rows=db.stock.filter(x=>x.l===l&&x.q>0);document.querySelector('#searchResults').innerHTML=`<div class="result"><div class="result-head"><b>${l||'مکان انتخاب نشده'}</b><span class="badge">${fa(rows.length)} طرح</span></div>${rows.length?rows.map(x=>`<div class="result-row"><span>${x.p} — ${product(x.p)?.name||''}</span><span class="qty">${fa(x.q)}</span><button class="secondary" onclick="quickOut('${x.p}','${l}')">برداشت</button></div>`).join(''):'<div class="empty">این مکان خالی است یا کد آن صحیح نیست.</div>'}</div>`};
window.quickOut=(p,l)=>{document.querySelector('#outProduct').value=p;document.querySelector('#outLoc').value=l;switchTab('out');showAvailable()};'''
          new2 = '''function sharedMemberLocations(x){const bits=String(x?.display||'').split('/').map(v=>v.trim());if(bits.length<3)return[];const shelf=bits[0],row=bits[1],boxes=bits.slice(2).join('/').split('-').map(v=>v.trim()).filter(Boolean);return boxes.map(box=>boxLocation(shelf,row,box)).filter(Boolean)}
function locationInventoryRows(l){l=norm(l);return db.stock.filter(x=>x.q>0&&(norm(x.l)===l||((x.shared||x.unassigned)&&sharedMemberLocations(x).includes(l))))}
document.querySelector('#showBoxBtn').onclick=()=>{const l=norm(document.querySelector('#findLocation').value),rows=locationInventoryRows(l),codeCount=new Set(rows.map(x=>x.p)).size;document.querySelector('#searchResults').innerHTML=`<div class="result"><div class="result-head"><b>${html(l||'مکان انتخاب نشده')}</b><span class="badge">${fa(codeCount)} کد مرتبط</span></div>${rows.length?rows.map(x=>{const shared=!!(x.shared||x.unassigned),name=product(x.p)?.name||'',detail=shared?`<small style="display:block;color:#8a6615;margin-top:4px">موجودی مشترک: ${html(x.display||x.l)}</small>`:'<small style="display:block;color:#647984;margin-top:4px">موجودی همین جعبه</small>',buttons=shared?`<div style="display:flex;flex-direction:column;gap:6px"><button class="primary" onclick="quickOutShared('${x.p}','${x.l}','${l}')">برداشت از مشترک</button><button class="secondary" onclick="openSplit('${x.p}','${x.l}')">تفکیک</button></div>`:`<button class="secondary" onclick="quickOut('${x.p}','${l}')">برداشت</button>`;return`<div class="result-row"><span><b>${html(x.p)} — ${html(name)}</b>${detail}</span><span class="qty"><small>${shared?'کل مشترک':'موجودی'}</small>${fa(x.q)}</span>${buttons}</div>`}).join(''):'<div class="empty">برای این جعبه موجودی مستقیم یا مشترک ثبت نشده است.</div>'}</div>`};
window.quickOut=(p,l)=>{sharedOutSource=null;document.querySelector('#outProduct').value=p;document.querySelector('#outLoc').value=l;switchTab('out');showAvailable()};
window.quickOutShared=(p,source,physical)=>{sharedOutSource={p:norm(p),l:norm(source),physical:norm(physical)};document.querySelector('#outProduct').value=p;document.querySelector('#outLoc').value=physical;switchTab('out');showAvailable();document.querySelector('#outQty').focus()};'''

          old3 = '''function showAvailable(){const p=norm(document.querySelector('#outProduct').value),l=norm(document.querySelector('#outLoc').value),el=document.querySelector('#outAvailable');if(!p){el.innerHTML='';return}const selected=l?item(p,l):null;if(selected?.q>0){el.innerHTML=`<div class="notice" style="margin-top:12px;margin-bottom:0">موجودی مکان انتخاب‌شده: <b>${fa(selected.q)}</b></div>`;return}const rows=db.stock.filter(x=>x.p===p&&x.q>0&&locationValid(x.l));const warning=l?'<div class="notice" style="margin-top:12px">این محصول در مکان واردشده موجود نیست؛ یکی از مکان‌های زیر را انتخاب کنید.</div>':'';el.innerHTML=rows.length?warning+`<div class="out-locations"><div class="out-locations-title">این محصول در ${fa(rows.length)} مکان موجود است؛ مکان برداشت را انتخاب یا QR آن را اسکن کنید.</div>${rows.map(x=>`<button type="button" class="out-location" onclick="selectOutLocation('${html(x.l)}')"><span class="location-code">${html(x.display||x.l)}</span><span class="qty"><small>موجودی</small>${fa(x.q)}</span></button>`).join('')}</div>`:`<div class="notice" style="margin-top:12px;margin-bottom:0">برای این کد، لوکیشن فعال و قابل برداشت پیدا نشد.</div>`}
window.selectOutLocation=l=>{document.querySelector('#outLoc').value=l;showAvailable();document.querySelector('#outQty').focus()};
document.querySelector('#outProduct').oninput=showAvailable;document.querySelector('#outLoc').oninput=showAvailable;
document.querySelector('#outSubmit').onclick=()=>run(()=>{const l=checkLoc('#outLoc'),p=norm(document.querySelector('#outProduct').value),q=Number(document.querySelector('#outQty').value);if(!p||q<=0)throw Error('کد محصول و تعداد خروج را کامل کنید.');const r=changeStock(p,l,-q);log('خروج',p,q,l,'',document.querySelector('#outNote').value,r.before,r.after);save();showAvailable();toast(`خروج ${fa(q)} عدد ثبت شد.`)});'''
          new3 = '''function showAvailable(){const p=norm(document.querySelector('#outProduct').value),l=norm(document.querySelector('#outLoc').value),el=document.querySelector('#outAvailable');if(!p){el.innerHTML='';return}const sharedSelected=sharedOutSource&&sharedOutSource.p===p&&sharedOutSource.physical===l?item(p,sharedOutSource.l):null;if(sharedSelected?.q>0){el.innerHTML=`<div class="shared-box"><strong>برداشت از موجودی مشترک</strong><div>جعبه اسکن‌شده: <span class="location-code">${html(l)}</span></div><div style="margin-top:6px">گروه مشترک: ${html(sharedSelected.display||sharedSelected.l)}</div><div class="split-summary"><span class="badge">موجودی مشترک کل: ${fa(sharedSelected.q)}</span></div><small>این برداشت از موجودی مشترک کم می‌شود و نیازی به تفکیک قبلی ندارد.</small></div>`;return}const selected=l?item(p,l):null;if(selected?.q>0){el.innerHTML=`<div class="notice" style="margin-top:12px;margin-bottom:0">موجودی مکان انتخاب‌شده: <b>${fa(selected.q)}</b></div>`;return}const rows=db.stock.filter(x=>x.p===p&&x.q>0&&locationValid(x.l));const warning=l?'<div class="notice" style="margin-top:12px">این محصول در مکان واردشده موجود نیست؛ یکی از مکان‌های زیر را انتخاب کنید.</div>':'';el.innerHTML=rows.length?warning+`<div class="out-locations"><div class="out-locations-title">این محصول در ${fa(rows.length)} مکان موجود است؛ مکان برداشت را انتخاب یا QR آن را اسکن کنید.</div>${rows.map(x=>`<button type="button" class="out-location" onclick="selectOutLocation('${html(x.l)}')"><span class="location-code">${html(x.display||x.l)}</span><span class="qty"><small>موجودی</small>${fa(x.q)}</span></button>`).join('')}</div>`:`<div class="notice" style="margin-top:12px;margin-bottom:0">برای این کد، لوکیشن فعال و قابل برداشت پیدا نشد.</div>`}
window.selectOutLocation=l=>{sharedOutSource=null;document.querySelector('#outLoc').value=l;showAvailable();document.querySelector('#outQty').focus()};
document.querySelector('#outProduct').oninput=()=>{if(sharedOutSource&&sharedOutSource.p!==norm(document.querySelector('#outProduct').value))sharedOutSource=null;showAvailable()};document.querySelector('#outLoc').oninput=()=>{if(sharedOutSource&&sharedOutSource.physical!==norm(document.querySelector('#outLoc').value))sharedOutSource=null;showAvailable()};
document.querySelector('#outSubmit').onclick=()=>run(()=>{const l=checkLoc('#outLoc'),p=norm(document.querySelector('#outProduct').value),q=Number(document.querySelector('#outQty').value);if(!p||q<=0)throw Error('کد محصول و تعداد خروج را کامل کنید.');let shared=null;if(sharedOutSource&&sharedOutSource.p===p&&sharedOutSource.physical===l){shared=item(p,sharedOutSource.l);if(!shared||shared.q<=0)throw Error('موجودی مشترک تغییر کرده است؛ ابتدا از اکسل تازه‌سازی کنید.')}const source=shared?sharedOutSource.l:l,r=changeStock(p,source,-q),wasShared=!!shared;log('خروج',p,q,source,wasShared?l:'',document.querySelector('#outNote').value,r.before,r.after);sharedOutSource=null;save();showAvailable();toast(wasShared?`خروج ${fa(q)} عدد از موجودی مشترک ثبت شد.`:`خروج ${fa(q)} عدد ثبت شد.`)});'''

          replacements = [(old1,new1),(old2,new2),(old3,new3)]
          for i,(old,new) in enumerate(replacements,1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'safety stop: replacement {i} matched {count} times')
              text = text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/warehouse-shared-box-patch.yml
          git config user.name "MahdiMuttaqi"
          git config user.email "mehdi.muttaqi2014@gmail.com"
          git add web/warehouse-pilot/index.html
          git commit -m "Show and withdraw shared stock by scanned box"
          git push origin main
