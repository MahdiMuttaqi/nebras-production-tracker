name: One-time warehouse mobile session patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/warehouse-session-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch warehouse mobile session behavior only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/warehouse-pilot/index.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          # 1) Header styling: only add a compact explicit logout control.
          old = '.online{display:flex;gap:7px;align-items:center;font-size:.82rem}.dot{width:9px;height:9px;border-radius:50%;background:#50d59e}'
          new = '.top-actions{display:flex;align-items:center;gap:10px}.online{display:flex;gap:7px;align-items:center;font-size:.82rem}.logout-btn{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:10px;padding:7px 10px;font-weight:800;font-size:.78rem}.logout-btn:active{background:#ffffff24}.dot{width:9px;height:9px;border-radius:50%;background:#50d59e}'
          replace_once(old, new, 'header css')

          # 2) Header markup: preserve existing sync indicator, add Logout beside it.
          old = '<header class="top"><div class="brand"><b>انبار هوشمند نبراس</b><small>متصل به فایل انبار و صف مرکزی</small></div><div class="online"><i class="dot" id="syncDot"></i><span id="syncText">آماده ثبت</span></div></header>'
          new = '<header class="top"><div class="brand"><b>انبار هوشمند نبراس</b><small>متصل به فایل انبار و صف مرکزی</small></div><div class="top-actions"><div class="online"><i class="dot" id="syncDot"></i><span id="syncText">آماده ثبت</span></div><button class="logout-btn" id="logoutBtn" type="button">خروج</button></div></header>'
          replace_once(old, new, 'header markup')

          # 3) Remember the manager code only for the lifetime of the current browser tab/session.
          old = "const SECURE_KEY='nebrasWarehousePilotSecureV1';\nconst DATA_VERSION="
          new = "const SECURE_KEY='nebrasWarehousePilotSecureV1';\nconst SESSION_PASSWORD_KEY='nebrasWarehousePilotSessionPasswordV1';\nconst DATA_VERSION="
          replace_once(old, new, 'session key constant')

          # 4) Cache the successful code in sessionStorage only after a valid unlock.
          old = "document.querySelector('#managerPassword').value='';save();document.querySelector('#searchResults').innerHTML=productResults('10-5041');"
          new = "sessionStorage.setItem(SESSION_PASSWORD_KEY,password);document.querySelector('#managerPassword').value='';save();document.querySelector('#searchResults').innerHTML=productResults('10-5041');"
          replace_once(old, new, 'remember successful login')

          # 5) Keep current login handlers, add explicit logout and same-tab automatic restore.
          old = "document.querySelector('#unlockBtn').onclick=unlock;document.querySelector('#managerPassword').onkeydown=e=>{if(e.key==='Enter')unlock()};\nfunction fa(n)"
          new = """document.querySelector('#unlockBtn').onclick=unlock;document.querySelector('#managerPassword').onkeydown=e=>{if(e.key==='Enter')unlock()};
function logoutWarehouse(){
 const unsent=db&&Array.isArray(db.history)?db.history.filter(h=>h.sync!=='synced').length:0;
 if(unsent&&!confirm(`${fa(unsent)} عملیات هنوز در صف ارسال است. عملیات در گوشی محفوظ می‌ماند و در ورود بعدی دوباره ارسال می‌شود. خارج شوید؟`))return;
 sessionStorage.removeItem(SESSION_PASSWORD_KEY);
 clearTimeout(syncTimer);
 if(scanTimer)cancelAnimationFrame(scanTimer);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;scanTimer=null;cryptoKey=null;db=null;initial=null;
 document.querySelector('#scanner')?.classList.remove('show');
 document.querySelector('#splitModal')?.classList.remove('show');
 document.querySelector('#app').classList.add('locked');
 document.querySelector('#lock').style.display='flex';
 document.querySelector('#managerPassword').value='';
 document.querySelector('#lockError').textContent='';
 document.querySelector('#managerPassword').focus();
}
document.querySelector('#logoutBtn').onclick=logoutWarehouse;
const rememberedPassword=sessionStorage.getItem(SESSION_PASSWORD_KEY);
if(rememberedPassword){document.querySelector('#managerPassword').value=rememberedPassword;setTimeout(unlock,0)}
function fa(n)"""
          replace_once(old, new, 'logout and session restore')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify surgical patch
        shell: bash
        run: |
          set -e
          grep -q "id=\"logoutBtn\"" web/warehouse-pilot/index.html
          grep -q "SESSION_PASSWORD_KEY='nebrasWarehousePilotSessionPasswordV1'" web/warehouse-pilot/index.html
          grep -q "function logoutWarehouse" web/warehouse-pilot/index.html
          git diff --check
          git diff -- web/warehouse-pilot/index.html

      - name: Commit only the warehouse pilot page
        shell: bash
        run: |
          set -e
          git config user.name "nebras-maintenance-bot"
          git config user.email "nebras-maintenance-bot@users.noreply.github.com"
          git add web/warehouse-pilot/index.html
          if git diff --cached --quiet; then
            echo "No index change to commit."
            exit 0
          fi
          git commit -m "Keep warehouse login on browser back and add logout"
          git push origin HEAD:main
