name: One-time warehouse mobile finalize

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/warehouse-mobile-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/warehouse_mobile_finalize.py
      - name: Verify patch
        run: |
          grep -q "localStorage.setItem(SESSION_PASSWORD_KEY,password)" web/warehouse-pilot/index.html
          grep -q "localStorage.removeItem(SESSION_PASSWORD_KEY)" web/warehouse-pilot/index.html
          grep -q "return'در حال ارسال'" web/warehouse-pilot/index.html
          grep -q "return'اعمال شد ✓'" web/warehouse-pilot/index.html
          grep -q "CONFIRMED_HISTORY_KEEP=100" web/warehouse-pilot/index.html
          grep -q "confirmedAt=new Date().toISOString()" web/warehouse-pilot/index.html
          grep -q "id=\"logoutBtn\"" web/warehouse-pilot/index.html
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "nebras-maintenance-bot"
          git config user.email "nebras-maintenance-bot@users.noreply.github.com"
          git add web/warehouse-pilot/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist warehouse login and clean only confirmed local history"
          git push origin HEAD:main
