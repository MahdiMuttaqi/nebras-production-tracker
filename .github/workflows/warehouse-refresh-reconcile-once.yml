name: One-time warehouse refresh reconciliation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/warehouse-refresh-reconcile-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/warehouse_refresh_reconcile.py
      - name: Verify patch
        run: |
          grep -q "function excelRejectedStatus" web/warehouse-pilot/index.html
          grep -q "pending=localHistory.filter(operationNeedsReplay)" web/warehouse-pilot/index.html
          grep -q "نیازمند بررسی ⚠" web/warehouse-pilot/index.html
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "nebras-maintenance-bot"
          git config user.email "nebras-maintenance-bot@users.noreply.github.com"
          git add web/warehouse-pilot/index.html
          git commit -m "Make Excel snapshot authoritative after applied or rejected mobile ops"
          git push origin HEAD:main
