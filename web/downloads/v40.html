<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دانلود V40 نبراس</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7f8;color:#17324a;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #d9e2e7;border-radius:16px;padding:24px;max-width:520px;width:calc(100% - 40px);box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}button{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:#173d5e;color:#fff;font-weight:700;cursor:pointer}small{display:block;margin-top:12px;color:#667b89;line-height:1.8}</style></head><body><div class="card"><h2>WarehouseV40DailyCapacity5000.bas</h2><p>فایل VBA آماده دانلود است.</p><button id="download">دانلود فایل BAS</button><small>اگر دانلود خودکار شروع نشد، دکمه را بزنید.</small></div><script>async function downloadBas(){const r=await fetch('./WarehouseV40DailyCapacity5000.bas?v=20260919-1',{cache:'no-store'});if(!r.ok)throw new Error('download failed');const text=await r.text();const blob=new Blob([text],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='WarehouseV40DailyCapacity5000.bas';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}document.querySelector('#download').onclick=()=>downloadBas().catch(()=>alert('دانلود انجام نشد؛ دوباره تلاش کنید.'));window.addEventListener('load',()=>setTimeout(()=>downloadBas().catch(()=>{}),350));</script></body></html>
