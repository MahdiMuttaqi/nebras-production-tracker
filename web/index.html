<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>سامانه پیگیری تولید نبراس</title>
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <div id="login" class="center">
    <form id="loginForm" class="panel">
      <div class="brand">نبراس کالا</div>
      <h1>پیگیری تولید</h1>
      <p id="loginHint">نام کاربری و رمز واحد خود را وارد کنید.</p>
      <input id="username" placeholder="نام کاربری" autocomplete="username" required>
      <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required minlength="4">
      <button type="submit">ورود به سامانه</button>
      <small id="loginError"></small>
    </form>
  </div>
  <main id="app" hidden>
    <header><div><small>سامانه زنده تولید</small><h1>پیگیری سفارش‌ها</h1></div><button id="logout" class="ghost">خروج</button></header>
    <section class="toolbar">
      <input id="search" placeholder="جست‌وجوی کد، مشتری یا مناسبت">
      <button id="refresh" class="ghost">تازه‌سازی</button>
      <button id="manageUsers" class="ghost" hidden>مدیریت کاربران</button>
      <button id="newJob" hidden>سفارش جدید</button>
    </section>
    <section id="stats" class="stats"></section>
    <nav id="orderTabs" class="orderTabs" hidden><button type="button" data-view="active" class="selected">در حال تولید <b id="activeCount">۰</b></button><button type="button" data-view="archive" class="ghost">بایگانی تکمیل‌شده‌ها <b id="archiveCount">۰</b></button></nav>
    <section class="sectionHead"><div><h2 id="heading">کارهای واحد</h2><small>اطلاعات خودکار تازه می‌شود</small></div><b id="count">۰ مورد</b></section>
    <section id="jobs" class="jobs"></section>
  </main>
  <dialog id="jobDialog"><form id="jobForm" method="dialog"><h2>سفارش جدید</h2><input id="code" placeholder="کد محصول" required><input id="quantity" type="number" min="1" value="1" placeholder="تعداد" required><input id="customer" placeholder="مشتری"><input id="occasion" placeholder="مناسبت"><div><button type="button" id="cancelJob" class="ghost">انصراف</button><button id="saveJob" value="default">ثبت و ارسال به پلاتر</button></div></form></dialog>
  <dialog id="userDialog" class="usersDialog"><section class="usersHead"><h2>مدیریت کاربران</h2><button type="button" id="closeUsers" class="ghost">بستن</button></section><div id="usersList" class="usersList"></div><form id="userForm"><h3 id="userFormTitle">کاربر جدید</h3><input id="userOriginal" type="hidden"><input id="userName" placeholder="نام شخص" required><input id="userUsername" dir="ltr" placeholder="نام کاربری انگلیسی" required><input id="userPassword" dir="ltr" type="password" minlength="4" placeholder="رمز عبور"><select id="userRole" required><option value="">انتخاب واحد</option><option value="admin">مدیر</option><option value="plotter">پلاتر</option><option value="calendar">کلندر</option><option value="cutting">برش</option><option value="laser">لیزر</option><option value="sewing">خیاط</option><option value="warehouse">انبار</option></select><label class="activeCheck"><input id="userActive" type="checkbox" checked> حساب فعال باشد</label><div><button type="button" id="cancelUser" class="ghost">پاک‌کردن فرم</button><button type="submit" id="saveUser">ساخت حساب</button></div></form></dialog>
  <script src="./config.js?v=4"></script>
  <script src="./app.js?v=13"></script>
</body>
</html>
